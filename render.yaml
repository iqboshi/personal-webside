services:
  - type: web
    name: personal-webside-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://iqboshi.github.io
      - key: DB_PATH
        value: /app/data/homepage.db
      - key: CONTENT_DIR
        value: /app/content/articles
      - key: STATIC_DIR
        value: /app/frontend/dist
