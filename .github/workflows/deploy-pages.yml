name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Export static data
        run: go run ./cmd/export-static -content content/articles -out frontend/public/data

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /personal-webside/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Prepare Pages files
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          for article in frontend/public/data/articles/*.json; do
            slug="$(basename "$article" .json)"
            mkdir -p "frontend/dist/post/$slug"
            cp frontend/dist/index.html "frontend/dist/post/$slug/index.html"
          done
          touch frontend/dist/.nojekyll

      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          rm -rf /tmp/personal-webside-pages
          mkdir -p /tmp/personal-webside-pages
          cp -R frontend/dist/. /tmp/personal-webside-pages/
          git checkout --orphan gh-pages-publish
          git rm -rf .
          cp -R /tmp/personal-webside-pages/. .
          git add -A
          git commit -m "Deploy GitHub Pages"
          git push --force origin HEAD:gh-pages
